<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7A8C9" />
    <title>Toot-Toot, Jump-Jump &amp; Oh-No!</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./gate.css" />
  </head>
  <body>
    <h1 class="gate-title">Toot-Toot, Jump-Jump &amp; Oh-No!</h1>
    <main class="gate">
      <a class="gate-card gate-ttt" href="./ttt/" aria-label="Toot-Toot Twenty">
        <span class="gate-art">
          <img src="./ttt/images/sprites/train.webp" alt="" />
        </span>
        <span class="gate-name">Toot-Toot</span>
      </a>
      <a class="gate-card gate-jjb" href="./jjb/" aria-label="Jump-Jump Bunny">
        <span class="gate-art" aria-hidden="true">
          <span class="bunny-stage">
            <span class="spark spark-a"></span>
            <span class="spark spark-b"></span>
            <span class="spark spark-c"></span>
            <span class="bunny-hop"></span>
          </span>
        </span>
        <span class="gate-name">Jump-Jump</span>
      </a>
      <a class="gate-card gate-oic" href="./oic/" aria-label="Oh-No Ice Cream">
        <span class="gate-art" aria-hidden="true">
          <svg class="cone-stack" viewBox="0 0 80 120">
            <circle class="scoop scoop-top" cx="40" cy="28" r="18" fill="#F7A1C4" stroke="#3B2418" stroke-width="3"/>
            <circle class="scoop" cx="40" cy="48" r="18" fill="#A8E6CF" stroke="#3B2418" stroke-width="3"/>
            <circle class="scoop" cx="40" cy="68" r="18" fill="#FFF1C9" stroke="#3B2418" stroke-width="3"/>
            <path d="M24 72 H56 L44 112 H36 Z" fill="#E9B872" stroke="#3B2418" stroke-width="3"/>
          </svg>
        </span>
        <span class="gate-name">Oh-No!</span>
      </a>
    </main>
  </body>
</html>
