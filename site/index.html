<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7A8C9" />
    <title>Toot-Toot &amp; Jump-Jump</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./gate.css" />
  </head>
  <body>
    <h1 class="gate-title">Toot-Toot &amp; Jump-Jump</h1>
    <main class="gate">
      <a class="gate-card gate-ttt" href="./ttt/" aria-label="Toot-Toot Twenty">
        <span class="gate-art">
          <img src="./ttt/images/sprites/train.webp" alt="" />
        </span>
        <span class="gate-name">Toot-Toot</span>
      </a>
      <a class="gate-card gate-jjb" href="./jjb/" aria-label="Jump-Jump Bunny">
        <span class="gate-art" aria-hidden="true">
          <svg class="hero-bunny" viewBox="0 0 80 96">
            <ellipse cx="26" cy="20" rx="9" ry="18" fill="#fff" stroke="#3a2030" stroke-width="3"/>
            <ellipse cx="54" cy="20" rx="9" ry="18" fill="#fff" stroke="#3a2030" stroke-width="3"/>
            <ellipse cx="26" cy="22" rx="4.2" ry="11" fill="#ffb7d1"/>
            <ellipse cx="54" cy="22" rx="4.2" ry="11" fill="#ffb7d1"/>
            <ellipse cx="40" cy="62" rx="28" ry="24" fill="#fff7fb" stroke="#3a2030" stroke-width="3"/>
            <path d="M16 60 Q40 80 64 60 Q56 70 40 73 Q24 70 16 60Z" fill="#e56b99" stroke="#3a2030" stroke-width="2.5"/>
            <circle cx="30" cy="56" r="3.2" fill="#3a2030"/>
            <circle cx="50" cy="56" r="3.2" fill="#3a2030"/>
            <ellipse cx="40" cy="64" rx="3" ry="2.1" fill="#e56b99"/>
            <ellipse cx="28" cy="86" rx="10" ry="6" fill="#fff" stroke="#3a2030" stroke-width="3"/>
            <ellipse cx="52" cy="86" rx="10" ry="6" fill="#fff" stroke="#3a2030" stroke-width="3"/>
          </svg>
        </span>
        <span class="gate-name">Jump-Jump</span>
      </a>
    </main>
  </body>
</html>
